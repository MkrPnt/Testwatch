<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeKeepers Essentials</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #007BFF;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 2.5rem;
        }
        main {
            flex: 1;
            text-align: center;
            padding: 40px 20px;
        }
        main h2 {
            font-size: 2rem;
            margin-bottom: 20px;
        }
        main p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .cta-btn {
            display: inline-block;
            background-color: #007BFF;
            color: white;
            padding: 15px 30px;
            font-size: 1.2rem;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .cta-btn:hover {
            background-color: #0056b3;
        }
        footer {
            background-color: #333;
            color: #fff;
            padding: 10px 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<header>
    <h1>TimeKeepers Essentials</h1>
</header>

<main>
    <h2>Houd je horloge in topvorm</h2>
    <p>Bij TimeKeepers Essentials bieden we betaalbare accessoires waarmee je jouw horloge kunt onderhouden, personaliseren en beschermen. Alles wat je nodig hebt, op één plek.</p>
    <a href="mailto:info@marketpnt.nl" class="cta-btn">Contacteer Ons</a>
</main>

<footer>
    <p>&copy; 2025 TimeKeepers Essentials. Alle rechten voorbehouden.</p>
</footer>

</body>
</html>
